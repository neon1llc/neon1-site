# .github/workflows/deploy.yml - Check the site, then deploy main to S3 and CloudFront.

name: deploy

# Pull requests run the checks; pushes to main and manual runs also deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_invalidation:
        description: Invalidate CloudFront even if no files changed
        type: boolean
        default: false

# Read-only by default; the deploy job adds an OIDC token for AWS
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history so gitleaks scans every commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # A push compares fonts and media with the commit before it; a pull request, with origin/main
      - run: make check
        env:
          IMMUTABLE_BASE: ${{ github.event.before }}

  # Deploys only from main, after the checks pass
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    # Let a running deploy finish; the next one starts after it
    concurrency:
      group: deploy-site
      cancel-in-progress: false

    # Sync, purge the CDN, then confirm the live version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Short-lived credentials from the deploy role through OIDC
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # The knowledge center's PDFs are printed here, from the pinned corpus, so they're never committed
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knowledge/package-lock.json

      - name: make knowledge-pdf
        run: |
          npm ci --prefix knowledge
          npx --prefix knowledge playwright install --with-deps chromium
          make knowledge-pdf

      - run: make deploy

      - name: make invalidate
        env:
          FORCE: ${{ inputs.force_invalidation && '1' || '' }}
        run: make invalidate FORCE="$FORCE"

      - run: make verify

      # Every released version gets an annotated tag on the commit that shipped it, once it's live
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*<meta name="version" content="\([^"]*\)".*/\1/p' src/app/public/index.html)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$version" -m "v$version" "$GITHUB_SHA"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$version"
          fi
