# neon1-site :: CI/CD — branch→environment mapping
name: neon1-site CI/CD

# Use src as working directory
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

on:
  # Run on pushes to the three environment branches
  push:
    branches: [ "development", "staging", "main" ]
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

permissions:
  id-token: write   # needed for OIDC → AWS
  contents: read

env:
  # Default AWS region (override via repo variables if needed)
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Map GitHub branches → Terraform env + IAM role
    env:
      ENV_NAME: ${{ github.ref == 'refs/heads/development' && 'development' ||
                    (github.ref == 'refs/heads/staging' && 'staging' || 'production') }}
      ROLE_ARN: ${{ github.ref == 'refs/heads/development' && vars.AWS_ROLE_TO_ASSUME_DEVELOPMENT ||
                    (github.ref == 'refs/heads/staging' && vars.AWS_ROLE_TO_ASSUME_STAGING || vars.AWS_ROLE_TO_ASSUME_PRODUCTION) }}

    steps:
      # Checkout the repo
      - name: Checkout
        uses: actions/checkout@v4

      # Configure AWS credentials via OIDC (no static secrets)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Initialize Terraform with env-specific backend
      - name: Terraform Init
        working-directory: infra/envs/${{ env.ENV_NAME }}
        run: terraform init -input=false -backend-config=backend.hcl

      # Apply Terraform configuration for this environment
      - name: Terraform Apply
        working-directory: infra/envs/${{ env.ENV_NAME }}
        run: terraform apply -input=false -auto-approve -var-file=${{ env.ENV_NAME }}.tfvars

      # Capture Terraform outputs (bucket, CF dist ID, Neo API URL)
      - name: Capture TF Outputs
        id: tfoutputs
        working-directory: infra/envs/${{ env.ENV_NAME }}
        run: |
          terraform output -json > tf-outputs.json
          echo "bucket=$(jq -r .bucket_name.value tf-outputs.json)" >> $GITHUB_OUTPUT
          echo "dist_id=$(jq -r .cloudfront_distribution_id.value tf-outputs.json)" >> $GITHUB_OUTPUT
          echo "neo_api=$(jq -r .neo_chat_api_url.value tf-outputs.json)" >> $GITHUB_OUTPUT

      # Build static site into dist/
      - name: Build static site
        run: scripts/build.sh

      # Write Neo chat API endpoint into dist/neo-config.js
      - name: Write Neo chat config to dist
        run: |
          echo "window.NEO_CHAT_API='${{ steps.tfoutputs.outputs.neo_api }}';" > dist/neo-config.js
          echo "Wrote dist/neo-config.js with ${{ steps.tfoutputs.outputs.neo_api }}"

      # Upload dist/ contents to the environment’s S3 bucket
      - name: Upload to S3
        run: |
          aws s3 sync dist s3://${{ steps.tfoutputs.outputs.bucket }} --delete

      # Invalidate CloudFront cache so changes go live immediately
      - name: Invalidate CloudFront
        if: ${{ steps.tfoutputs.outputs.dist_id != '' }}
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ steps.tfoutputs.outputs.dist_id }} --paths "/*"
