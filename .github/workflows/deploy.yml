# .github/workflows/deploy.yml - Check the site, then deploy main to S3 and CloudFront.
# Every build takes the newest neon1-corpus release, and a watch publishes each new corpus release on its own,
# so corpus words go live without a site change (README, Publishing a corpus release).

name: deploy

# Pull requests run the checks; pushes to main and manual runs also deploy. The schedule is the corpus watch:
# it deploys main only when the newest corpus release isn't the one live, and otherwise stops after one request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_invalidation:
        description: Also invalidate CloudFront (releases don't need it; for a font, media, or .well-known file changed in place)
        type: boolean
        default: false

# Read-only by default; the deploy job adds an OIDC token for AWS
permissions:
  contents: read

jobs:
  # Which corpus release this run builds, decided once so the checks and the deploy use the same one. The
  # watch goes ahead only when the live site names another release in /knowledge/corpus.json
  plan:
    runs-on: ubuntu-latest
    outputs:
      corpus_tag: ${{ steps.pick.outputs.corpus_tag }}
      go: ${{ steps.pick.outputs.go }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          tag=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/neon1llc/neon1-corpus 'v*' \
            | sed -n 's|.*refs/tags/\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$|\1|p' | head -1)
          test -n "$tag" || { echo "::error::no neon1-corpus release found"; exit 1; }
          go=true
          if [ "$EVENT" = "schedule" ]; then
            live=$(curl -fsS --max-time 15 https://neon1.tech/knowledge/corpus.json | sed -n 's/.*"tag":"\([^"]*\)".*/\1/p' || true)
            if [ "$live" = "$tag" ]; then go=false; echo "neon1.tech already shows neon1-corpus $tag"; else echo "neon1.tech shows ${live:-no corpus release}; publishing $tag"; fi
          fi
          echo "corpus_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      CORPUS_TAG: ${{ needs.plan.outputs.corpus_tag }}
    steps:
      # Full history so gitleaks scans every commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The npm cache is keyed on the printer's lockfile, which also pins the Playwright the browser checks use
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knowledge/package-lock.json

      # The corpus-made pages aren't committed, so they're written first, from the planned corpus release
      - run: make content

      # A push compares fonts and media with the commit before it; a pull request, with origin/main
      - run: make check
        env:
          IMMUTABLE_BASE: ${{ github.event.before }}

      # Browser contracts, gating the deploy job like make check: the contact form (including a send that
      # never answers), case studies and case links, the first screen and section snap, the tool cards, the
      # white rabbit's entry, controls, and lifetime, and the chat window. Both scripts serve the site on
      # loopback and stub every API, aborting anything that leaves it, so nothing reaches a live service.
      # Playwright comes from knowledge/package-lock.json, the same locked version the PDF printer uses
      - name: Install Playwright and Chromium
        run: |
          npm ci --prefix knowledge
          npx --prefix knowledge playwright install --with-deps chromium

      - name: make behavior
        env:
          NODE_PATH: ${{ github.workspace }}/knowledge/node_modules
        run: make behavior

      - name: Chat window checks
        env:
          NODE_PATH: ${{ github.workspace }}/knowledge/node_modules
        run: node scripts/chat_check.cjs

  # Deploys only from main, after the static checks and the browser contracts in check pass; nothing
  # touches S3 or CloudFront before then
  deploy:
    needs: [plan, check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CORPUS_TAG: ${{ needs.plan.outputs.corpus_tag }}
    permissions:
      contents: write
      id-token: write

    # Let a running deploy finish; the next one starts after it
    concurrency:
      group: deploy-site
      cancel-in-progress: false

    # Upload the release, switch to it, then confirm the live version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Short-lived credentials from the deploy role through OIDC
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # The knowledge center's pages and PDFs are written here, from the planned corpus release, never committed
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knowledge/package-lock.json

      # The same corpus release the checks passed, written again here, then printed
      - name: make content and knowledge-pdf
        run: |
          make content
          npm ci --prefix knowledge
          npx --prefix knowledge playwright install --with-deps chromium
          make knowledge-pdf

      - run: make deploy

      # Releases switch whole and get new cache keys; a purge only on request
      - if: inputs.force_invalidation
        run: make invalidate

      - run: make verify

      # Ask IndexNow engines to re-read the pages that changed; a refused ping doesn't fail the deploy
      - run: make indexnow
        continue-on-error: true

      # Every released version gets an annotated tag on the commit that shipped it, once it's live
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*<meta name="version" content="\([^"]*\)".*/\1/p' src/app/public/index.html)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$version" -m "v$version" "$GITHUB_SHA"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$version"
          fi
