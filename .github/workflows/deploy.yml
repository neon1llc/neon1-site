# .github/workflows/deploy.yml - Check the site, then deploy main to S3 and CloudFront.
# Every build takes the newest neon1-corpus release, and a watch publishes each new corpus release on its own,
# so corpus words go live without a site change (README, Publishing a corpus release).
# Every run that deploys also rebuilds dev.neon1.tech from the new main in the dev job, beside the deploy job,
# so dev never falls behind production and a dev failure shows red on this run.

name: deploy

# Pull requests run the checks; pushes to main and manual runs also deploy. The schedule is the corpus and
# releases watch: it deploys main only when the newest corpus release, or any public repository's newest release
# (the Knowledge Center's releases page), isn't the one live, and otherwise stops after two requests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_invalidation:
        description: Also invalidate CloudFront (releases don't need it; for a font, media, or .well-known file changed in place)
        type: boolean
        default: false

# Read-only by default; the deploy and dev jobs add what they need
permissions:
  contents: read

jobs:
  # Which corpus release this run builds, decided once so the checks and the deploy use the same one. The
  # watch goes ahead only when the live site names another release in /knowledge/corpus.json
  plan:
    runs-on: ubuntu-latest
    outputs:
      corpus_tag: ${{ steps.pick.outputs.corpus_tag }}
      releases_pin: ${{ steps.pick.outputs.releases_pin }}
      go: ${{ steps.pick.outputs.go }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          tag=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/neon1llc/neon1-corpus 'v*' \
            | sed -n 's|.*refs/tags/\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$|\1|p' | head -1)
          test -n "$tag" || { echo "::error::no neon1-corpus release found"; exit 1; }
          # Each public repository's newest release, in scripts/releases.sh's order and form, for the releases page
          pin=()
          for repo in neon1-1NEON neon1-chat neon1-corpus neon1-aws-infrastructure refmark deploy-ops aws-clip ready-secure-go soc-2-readiness compliance-basics incident-response-for-small-teams phishing-awareness-kit household-tech-handbook; do
            t=$(git ls-remote --tags --refs --sort=-v:refname "https://github.com/neon1llc/$repo" 'v*' \
              | sed -n 's|.*refs/tags/\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$|\1|p' | head -1)
            test -n "$t" || { echo "::error::no $repo release found"; exit 1; }
            pin+=("$repo@$t")
          done
          releases=$(IFS=,; echo "${pin[*]}")
          go=true
          if [ "$EVENT" = "schedule" ]; then
            live=$(curl -fsS --max-time 15 https://neon1.tech/knowledge/corpus.json | sed -n 's/.*"tag":"\([^"]*\)".*/\1/p' || true)
            live_pin=$(curl -fsS --max-time 15 https://neon1.tech/knowledge/releases.json | sed -n 's/.*"pin":"\([^"]*\)".*/\1/p' || true)
            if [ "$live" = "$tag" ] && [ "$live_pin" = "$releases" ]; then go=false; echo "neon1.tech already shows neon1-corpus $tag and every newest release"
            else echo "neon1.tech shows ${live:-no corpus release} and ${live_pin:-no releases}; publishing $tag and $releases"; fi
          fi
          echo "corpus_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "releases_pin=$releases" >> "$GITHUB_OUTPUT"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  # The site's generated parts, written once and packed. The browser checks run on these exact bytes and the
  # deploy job uploads them, so what shipped is what was tested. (The Knowledge Center's PDFs are printed beside it.)
  build:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      CORPUS_TAG: ${{ needs.plan.outputs.corpus_tag }}
      RELEASES_PIN: ${{ needs.plan.outputs.releases_pin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knowledge/package-lock.json
      - run: make content
      # A tar keeps hidden files (.well-known) and modes exactly
      - run: tar czf "$RUNNER_TEMP/site.tgz" -C src/app/public .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site.tgz
          retention-days: 3

  # The Knowledge Center's PDFs, printed beside the pages from the same corpus release, in parallel with the checks
  pdf:
    needs: plan
    if: needs.plan.outputs.go == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CORPUS_TAG: ${{ needs.plan.outputs.corpus_tag }}
      RELEASES_PIN: ${{ needs.plan.outputs.releases_pin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knowledge/package-lock.json
      - name: make content and knowledge-pdf
        run: |
          make content
          npm ci --prefix knowledge
          npx --prefix knowledge playwright install --with-deps chromium
          make knowledge-pdf
      - run: (cd src/app/public && find knowledge -name '*.pdf' -print0 | tar czf "$RUNNER_TEMP/pdfs.tgz" --null -T -)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfs
          path: ${{ runner.temp }}/pdfs.tgz
          retention-days: 3

  # The static checks, on their own build of the same corpus release
  check:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    env:
      CORPUS_TAG: ${{ needs.plan.outputs.corpus_tag }}
      RELEASES_PIN: ${{ needs.plan.outputs.releases_pin }}
    steps:
      # Full history so gitleaks scans every commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knowledge/package-lock.json
      # The corpus-made pages aren't committed, so they're written first, from the planned corpus release
      - run: make content
      # A push compares fonts and media with the commit before it; a pull request, with origin/main
      - run: make check
        env:
          IMMUTABLE_BASE: ${{ github.event.before }}

  # Browser contracts, gating the deploy job like make check: the contact form (including a send that never
  # answers), case studies and case links, the first screen and section snap, the tool cards, the white rabbit's
  # entry, controls, and lifetime, and the chat window. They run in three shards at once (every third check each,
  # about a minute apiece instead of three), on the built site's exact bytes. Both scripts serve the site on
  # loopback and stub every API, aborting anything that leaves it, so nothing reaches a live service. Playwright
  # comes from knowledge/package-lock.json, the same locked version the PDF printer uses
  behavior:
    needs: [plan, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knowledge/package-lock.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: site
          path: ${{ runner.temp }}/site
      - run: tar xzf "$RUNNER_TEMP/site/site.tgz" -C src/app/public
      - name: Install Playwright and Chromium
        run: |
          npm ci --prefix knowledge
          npx --prefix knowledge playwright install --with-deps chromium
      - name: make behavior (shard ${{ matrix.shard }} of 3)
        env:
          NODE_PATH: ${{ github.workspace }}/knowledge/node_modules
          SHARD: ${{ matrix.shard }}/3
        run: make behavior
      # The chat window's checks ride with the lightest shard
      - name: Chat window checks
        if: matrix.shard == 0
        env:
          NODE_PATH: ${{ github.workspace }}/knowledge/node_modules
        run: node scripts/chat_check.cjs

  # Merges main into dev and rebuilds dev.neon1.tech, in parallel with the deploy job and on the same checks. A
  # schedule run that found a new corpus release comes here too, since dev must show the release production does.
  # The called workflows need contents to push dev and an OIDC token for the dev deploy role
  dev:
    needs: [plan, check, behavior]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.go == 'true'
    uses: ./.github/workflows/dev-sync.yml
    with:
      corpus_tag: ${{ needs.plan.outputs.corpus_tag }}
    permissions:
      contents: write
      id-token: write

  # Deploys only from main, after the static checks and the browser contracts pass; nothing touches S3 or
  # CloudFront before then. It uploads the site the checks ran on, so it needs no Node, Playwright, or build
  deploy:
    needs: [plan, check, behavior, pdf]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CORPUS_TAG: ${{ needs.plan.outputs.corpus_tag }}
      RELEASES_PIN: ${{ needs.plan.outputs.releases_pin }}
    permissions:
      contents: write
      id-token: write

    # Let a running deploy finish; the next one starts after it
    concurrency:
      group: deploy-site
      cancel-in-progress: false

    # Upload the release, switch to it, then confirm the live version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Short-lived credentials from the deploy role through OIDC
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # The exact site the browser checks ran on, and the PDFs printed from the same corpus release
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/built
      - name: Unpack the tested site
        run: |
          tar xzf "$RUNNER_TEMP/built/site/site.tgz" -C src/app/public
          tar xzf "$RUNNER_TEMP/built/pdfs/pdfs.tgz" -C src/app/public
          test -f src/app/public/index.html

      - run: make deploy

      # Releases switch whole and get new cache keys; a purge only on request
      - if: inputs.force_invalidation
        run: make invalidate

      - run: make verify

      # Ask IndexNow engines to re-read the pages that changed; a refused ping doesn't fail the deploy
      - run: make indexnow
        continue-on-error: true

      # Every released version gets an annotated tag on the commit that shipped it, once it's live
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*<meta name="version" content="\([^"]*\)".*/\1/p' src/app/public/index.html)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$version" -m "v$version" "$GITHUB_SHA"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$version"
          fi

      # The release's notes on GitHub are its changelog entry, so the Releases page reads newest first.
      # A failure here only warns: the release is already live and tagged
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*<meta name="version" content="\([^"]*\)".*/\1/p' src/app/public/index.html)
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "v$version already has release notes"; exit 0; fi
          awk -v v="v$version" '$0 ~ "^## "v"( |$)" {f=1; if ($4) print "Released "$4"."; next} /^## / {f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" -R "$GITHUB_REPOSITORY" --verify-tag --title "v$version" --notes-file "$RUNNER_TEMP/notes.md" \
            || echo "::warning::v$version has no release notes yet"
