<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐇</text></svg>"
        />
        <title>neon1</title>
        <meta name="theme-color" content="#000000" />
        <style>
            :root {
                --bg: #000;
                --neon-green: #00ff6a;
                --neon-green-bright: #9aff9a;
                --neon-white: #eaffea;
                /* NEW: unified vertical safe area used when modal is open */
                --safe-y: clamp(16px, 6vh, 72px);
            }
            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: #8cffc2;
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
                    monospace;
                overflow-x: hidden;
            }

            /* Canvas + vignette */
            #rain {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                display: block;
                z-index: 0;
            }
            #vignette {
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 1;
                background: radial-gradient(120% 80% at 50% -10%, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.6) 70%),
                    radial-gradient(120% 80% at 50% 110%, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.7) 70%);
            }

            /* Hero */
            .hero {
                position: relative;
                z-index: 4;
                min-height: 100svh; /* avoid iOS URL bar jumps */
                display: grid;
                place-items: center;
                text-align: center;
            }
            .hero-inner {
                width: min(1200px, 92vw);
                /* CHANGED: use grid so brand / modal / tag share vertical space */
                display: grid;
                grid-template-rows: auto; /* let rows be content-sized */
                grid-auto-rows: min-content; /* any extra rows (the hidden modal) collapse */
                align-content: center; /* keep brand + tag together */
                justify-items: center;
                align-items: center;
                row-gap: clamp(10px, 2.2vw, 18px);
                position: relative;
                min-height: min(70vh, 100svh);
                transition: grid-template-rows 250ms ease, padding 250ms ease;
                padding-block: 0;
                transition: padding-block var(--modal-dur) var(--modal-ease), row-gap var(--modal-dur) var(--modal-ease);
            }
            /* OPEN (modal visible) */
            .split-open .hero-inner {
                grid-template-rows: 1fr auto 1fr; /* brand / modal / tag */
                align-content: stretch; /* distribute the space evenly */
            }

            .brand {
                font-size: clamp(28px, 5vw, 64px);
                letter-spacing: 0.06em;
                text-transform: lowercase;
                color: var(--neon-green-bright);
                text-shadow: 0 0 8px rgba(154, 255, 154, 0.7), 0 0 18px rgba(0, 255, 106, 0.45);
                margin: 0;
                line-height: 1;
                white-space: nowrap;
            }
            .split-open .brand {
                align-self: end;
            } /* sit just above the modal */

            .neon1-split {
                display: inline-block;
                line-height: 1;
                vertical-align: baseline;
            }
            .neon1-split.digit {
                transform: scale(0.8);
                transform-origin: bottom left;
            }

            .tag {
                color: #a8ffcf;
                opacity: 0.9;
                font-size: clamp(12px, 1.6vw, 16px);
                margin: 0;
            }
            .split-open .tag {
                align-self: start;
            } /* sit just below the modal */

            @media (prefers-reduced-motion: reduce) {
                #rain {
                    display: none;
                }
                body {
                    background: linear-gradient(#001b12, #000);
                }
            }

            /* Controls */
            .controls {
                position: fixed;
                right: 12px;
                bottom: 12px;
                z-index: 8;
                display: flex;
                gap: 8px;
                align-items: center;
                flex-wrap: wrap;
            }
            .btn {
                background: rgba(0, 0, 0, 0.6);
                border: 1px solid #0f4;
                color: #bfffd6;
                padding: 6px 10px;
                border-radius: 8px;
                font-size: 12px;
                cursor: pointer;
                backdrop-filter: blur(6px);
            }
            .btn[aria-pressed="true"] {
                border-color: #9aff9a;
                color: #eaffea;
            }

            /* Entry cursor + typed echo */
            .entry-wrap {
                position: fixed;
                left: 12px;
                bottom: 10px;
                z-index: 8;
                display: flex;
                gap: 6px;
                align-items: baseline;
                user-select: none;
                pointer-events: none;
                font-size: 14px;
                color: var(--neon-green-bright);
                text-shadow: 0 0 10px rgba(0, 255, 106, 0.65);
                opacity: 0.85;
            }
            .entry-cursor {
                width: 9px;
                height: 16px;
                display: inline-block;
                background: var(--neon-green);
                box-shadow: 0 0 10px var(--neon-green);
                animation: blink 1s step-end infinite;
            }
            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }

            /* Backdrop */
            .backdrop {
                position: fixed;
                inset: 0;
                z-index: 3;
                background: rgba(0, 0, 0, 0.75);
                opacity: 0;
                pointer-events: none;
                transition: opacity 300ms ease;
            }
            .backdrop.active {
                opacity: 1;
                pointer-events: auto;
            }

            /* MODAL: now IN-FLOW (not absolutely centered).
               That way it *pushes* brand + tag evenly using the grid rows above.
            */
            .modal-strip {
                position: relative;
                width: min(92vw, 1100px);
                border: 0 solid var(--neon-green);
                border-radius: 16px;
                padding: 0; /* collapsed when closed */
                background: rgba(0, 0, 0, 0.55);
                color: var(--neon-white);
                box-shadow: 0 0 30px rgba(0, 255, 106, 0.25), inset 0 0 20px rgba(0, 255, 106, 0.1);
                text-align: left;
                overflow: hidden; /* required for height animation */
                max-height: 0; /* closed */
                opacity: 0;
                pointer-events: none;
                transform-origin: top center;
                transition: max-height var(--modal-dur) var(--modal-ease), padding var(--modal-dur) var(--modal-ease),
                    border-width var(--modal-dur) var(--modal-ease), opacity 240ms ease, transform 240ms ease;
            }
            .modal-strip.active {
                max-height: calc(100svh - (2 * var(--safe-y)) - 32px); /* opens to full safe space */
                overflow: auto; /* scroll if content exceeds */
                padding: clamp(14px, 2.4vw, 26px);
                border-width: 2px;
                opacity: 1;
                pointer-events: auto;
                transform: translateY(0) scale(1); /* keep from your current styles */
            }
            .modal-strip h2 {
                margin: 0 0 0.6rem 0;
                font-weight: 800;
                color: var(--neon-green-bright);
                text-shadow: 0 0 10px rgba(0, 255, 106, 0.6);
            }
            .modal-inner {
                display: grid;
                gap: 0.5rem;
            }
            .modal-inner p {
                margin: 0;
            }
            .modal-inner ul {
                margin: 0;
                padding-left: 1.2rem;
            }
            .muted {
                opacity: 0.9;
            }
            .kbd {
                border: 1px solid var(--neon-green);
                border-radius: 6px;
                padding: 0 0.35rem;
            }

            /* Horizontal scroller */
            .h-scroll {
                display: flex;
                gap: 16px;
                overflow-x: auto;
                overflow-y: hidden;
                padding-bottom: 8px;
                scroll-snap-type: x mandatory;
                -webkit-overflow-scrolling: touch;
            }
            .card,
            .tcard {
                scroll-snap-align: start;
                min-width: clamp(240px, 42vw, 360px);
                background: rgba(0, 0, 0, 0.4);
                border: 1px solid var(--neon-green);
                border-radius: 14px;
                padding: 12px;
                box-shadow: 0 0 20px rgba(0, 255, 106, 0.18), inset 0 0 10px rgba(0, 255, 106, 0.08);
            }
            .card a {
                color: var(--neon-white);
                text-decoration: none;
                display: block;
            }
            .card .thumb {
                height: 160px;
                border-radius: 10px;
                display: grid;
                place-items: center;
                background: linear-gradient(135deg, rgba(0, 255, 106, 0.2), rgba(0, 255, 106, 0.05));
                margin-bottom: 8px;
                font-weight: 700;
                letter-spacing: 0.03em;
                color: var(--neon-green-bright);
                text-shadow: 0 0 8px rgba(0, 255, 106, 0.6);
            }
            .tcard blockquote {
                margin: 0 0 0.6rem 0;
                font-style: italic;
                color: var(--neon-white);
            }
            .tcard .byline {
                color: #c9ffdf;
                font-size: 0.9rem;
            }
            .email-grid {
                display: grid;
                gap: 0.5rem;
                grid-template-columns: 1fr;
            }
            .email {
                padding: 8px 10px;
                border: 1px solid var(--neon-green);
                border-radius: 10px;
            }
            .email a {
                color: var(--neon-white);
                text-decoration: none;
            }
            @media (min-width: 700px) {
                .email-grid {
                    grid-template-columns: 1fr 1fr;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .hero-inner,
                .modal-strip {
                    transition: none !important;
                }
            }
            :root {
                --modal-dur: 1000ms;
                --modal-ease: 500ms;
            }
            .contact-links {
                display: flex;
                gap: 16px;
                flex-wrap: wrap;
                margin-top: 20px;
            }
            .contact-link {
                color: #9aff9a; /* neon green accent */
                text-decoration: none;
                font-size: 14px;
            }
            .contact-link:hover {
                text-decoration: underline;
            }
            .email-address {
                cursor: pointer;
            }
            .email-address:hover {
                text-decoration: underline;
            }
            .rabbit-bg {
                position: relative;
                height: 20rem; /* your fixed height */
                background-image: url("../public/media/follow-the-white-rabbit.gif");
                background-size: cover;
                background-position: center;
                border-radius: 10px;
                overflow: hidden;

                /* New centering styles */
                display: flex;
                justify-content: center; /* horizontal centering */
                align-items: center; /* vertical centering */
                text-align: center; /* keeps text centered inline */
            }
            /* dark overlay for readability */
            .rabbit-bg::before {
                content: "";
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                z-index: 0;
            }
            .rabbit-content {
                position: relative;
                z-index: 1;
                color: #eaffea;
                max-width: 90%; /* prevents text from stretching too wide */
            }
            .robin-bg {
                position: relative;
                min-height: 100%;
                overflow: hidden;
            }
            .robin-section {
                position: absolute;
                left: 0;
                right: 0;
                height: 33.33%; /* divide modal height into thirds */
                background-size: cover;
                background-position: center;
                opacity: 0.3; /* keep subtle so text is readable */
                filter: brightness(0.6); /* darken a bit */
            }
            .robin-section.top {
                top: 0;
                background-image: url("../public/media/neo1.jpg");
            }
            .robin-section.middle {
                top: 33.33%;
                background-image: url("../public/media/robin1.jpg");
            }
            .robin-section.bottom {
                bottom: 0;
                background-image: url("../public/media/robin2.jpg");
            }
            .robin-content {
                position: relative;
                z-index: 1;
                padding: 1.5rem;
                color: #eaffea; /* neon white */
            }
            /* body.modal-open {
                overflow: hidden;
            } */
        </style>
    </head>

                const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));

                function normalizeKey(s) {

                function enhanceHScroll(scope) {

                // --- bind copy-to-clipboard on .email-address (works for dynamic modal content)

                /* Rain config (unchanged) */
                const CONFIG = {

                        { name: "hangul", ranges: [[0xac00, 0xd7a3]], weight: 3 },
                        { name: "cjk", ranges: [[0x4e00, 0x9fff]], weight: 18 },
                        {
                            name: "emoji",
                            ranges: [
                                [0x1f300, 0x1f5ff],
                                [0x1f600, 0x1f64f],
                                [0x1f680, 0x1f6ff],
                                [0x1f900, 0x1f9ff],
                                [0x1fa70, 0x1faff],

                    ],
                    columnSize: 50,
                    glyphScale: 0.5,
                    trailAlpha: 0.02,
                    baseSpeed: 0.01,
                    speedVariance: 0.5,
                    scrollSpeedBoost: 0.01,
                    mouseInfluence: 160,
                    mouseBoost: 0.75,
                    glowBase: 8,
                    glowBoost: 14,
                    maskScale: 0.62,
                    density: 0.5,
                    grid: { snap: true, line_height: 1.15, row_spacing: 1, align: "round", startAtTop: true },
                    palette: { base: "#00ff6a", bright: "#9aff9a", flare: "#eaffea" },
                    dropWords: [
                        "neon1",
                        "1withtechnology",
                        "robin williams",
                        "1 is glad to be of service",
                        "the matrix",
                        "neo",
                        "trinity",
                        "morpheus",
                    ],
                    wordChance: 0.01,
                    forceUppercase: false,
                    classStyles: {
                        "drop-word": { mode: "glow", color: "#fff", glow: 20, outline: "#eaffea", fontWeight: "900" },
                    },
                    charPoolSize: 2048,
                    charPoolRefreshMs: 60000,
                };

                const maskCtxData = { data: null };
                let width = 0,
                    height = 0,
                    cols = 0,
                    colSize = 0,
                    rows = 0;
                let yPositions = [],
                    speeds = [],
                    activeWords = [],
                    lastRowDrawn = [];

                function randInRange([a, b]) {
                    return a + Math.floor(Math.random() * (b - a + 1));
                }
                function pickFromRanges(ranges) {
                    const r = ranges[(Math.random() * ranges.length) | 0];
                    return String.fromCodePoint(randInRange(r));
                }
                function pickWeightedCharsetIndex() {
                    const arr = CONFIG.charsets;
                    let total = 0;
                    for (let i = 0; i < arr.length; i++) total += Math.max(0, arr[i].weight || 0);
                    if (total <= 0) return 0;
                    let r = Math.random() * total;
                    for (let i = 0; i < arr.length; i++) {
                        r -= Math.max(0, arr[i].weight || 0);
                        if (r < 0) return i;
                    }
                    return arr.length - 1;
                }
                function randomCharMeta() {
                    const idx = pickWeightedCharsetIndex();
                    const set = CONFIG.charsets[idx];
                    return { ch: pickFromRanges(set.ranges), baseClass: set.name };
                }
                function findCharsetNameForCode(cp) {
                    const sets = CONFIG.charsets;
                    for (let i = 0; i < sets.length; i++) {
                        const rgs = sets[i].ranges;
                        for (let j = 0; j < rgs.length; j++) {
                            const r = rgs[j];
                            if (cp >= r[0] && cp <= r[1]) return sets[i].name;
                        }
                    }
                    return "unknown";
                }
                function classifyChar(ch, baseClass, isWordChar) {
                    const classes = [];
                    if (isWordChar) classes.push("drop-word");
                    if (baseClass) classes.push(baseClass);
                    else {
                        const cp = ch.codePointAt(0) || ch.charCodeAt(0);
                        classes.push(findCharsetNameForCode(cp));
                    }
                    const up = ch.toUpperCase(),
                        lo = ch.toLowerCase();
                    if (up !== lo) classes.push(ch === up ? "uppercase" : "lowercase");
                    return classes;
                }
                function applyClassStyles(baseColor, baseGlow, classes) {
                    const style = {
                        mode: null,
                        color: baseColor,
                        glow: baseGlow,
                        outline: "#eaffea",
                        fontWeight: null,
                        fontFamily: null,
                    };
                    const map = CONFIG.classStyles || {};
                    for (let i = 0; i < classes.length; i++) {
                        const s = map[classes[i]];
                        if (!s) continue;
                        if (s.mode) style.mode = s.mode;
                        if (s.color) style.color = s.color;
                        if (s.outline) style.outline = s.outline;
                        if (typeof s.glow === "number") style.glow = s.glow;
                        if (s.fontWeight) style.fontWeight = s.fontWeight;
                        if (s.fontFamily) style.fontFamily = s.fontFamily;
                    }
                    return style;
                }
                let CHAR_POOL = [],
                    charPoolIdx = 0,
                    nextCharPoolRefresh = 0;
                function refillCharPool(n = CONFIG.charPoolSize) {
                    CHAR_POOL = Array.from({ length: n }, () => randomCharMeta());
                    charPoolIdx = 0;
                }
                function getCachedCharMeta() {
                    const m = CHAR_POOL[charPoolIdx++];
                    if (charPoolIdx >= CHAR_POOL.length) charPoolIdx = 0;
                    return m;
                }

                const mouse = { x: -9999, y: -9999 };
                let paused = false;

                function buildMask() {
                    const vw = width,
                        vh = height;
                    maskCanvas.width = vw;
                    maskCanvas.height = vh;
                    maskCtx.clearRect(0, 0, vw, vh);
                    const scale = CONFIG.maskScale;
                    const textW = Math.floor(vw * scale);
                    const fontPx = Math.floor(textW / 5.8);
                    maskCtx.save();
                    maskCtx.fillStyle = "#fff";
                    maskCtx.textAlign = "center";
                    maskCtx.textBaseline = "middle";
                    maskCtx.font = `900 ${fontPx}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
                    maskCtx.translate(vw / 2, vh / 2);
                    maskCtx.fillText(CONFIG.textMask, 0, 0);
                    maskCtx.restore();
                    maskCtxData.data = maskCtx.getImageData(0, 0, vw, vh).data;
                }
                function maskHit(px, py) {
                    const data = maskCtxData.data;
                    if (!data) return 0;
                    const x = Math.max(0, Math.min(width - 1, px | 0));
                    const y = Math.max(0, Math.min(height - 1, py | 0));
                    const idx = (y * width + x) * 4;
                    return data[idx] / 255;
                }

                function resize() {
                    const { innerWidth, innerHeight } = window;
                    width = Math.floor(innerWidth * dpr);
                    height = Math.floor(innerHeight * dpr);
                    canvas.width = width;
                    canvas.height = height;
                    canvas.style.width = innerWidth + "px";
                    canvas.style.height = innerHeight + "px";
                    colSize = Math.max(14, CONFIG.columnSize) * dpr;
                    cols = Math.floor(width / colSize);
                    rows = Math.floor(height / colSize);
                    yPositions = new Array(cols);
                    speeds = new Array(cols);
                    activeWords = new Array(cols).fill(null);
                    lastRowDrawn = new Array(cols).fill(-1e9);
                    for (let i = 0; i < cols; i++) {
                        yPositions[i] = CONFIG.mode === "grid" ? 0 : -Math.random() * (height / colSize);
                        speeds[i] = CONFIG.baseSpeed + Math.random() * CONFIG.speedVariance;
                    }
                    buildMask();
                }

                function draw() {
                    if (paused) {
                        requestAnimationFrame(draw);
                        return;
                    }
                    const now = performance.now();
                    if (now >= nextCharPoolRefresh) {
                        refillCharPool();

                    }
                    ctx.fillStyle = `rgba(0,0,0,${CONFIG.trailAlpha})`;
                    ctx.fillRect(0, 0, width, height);
                    const scrollBoost = 1 + window.scrollY * CONFIG.scrollSpeedBoost;
                    ctx.textBaseline = "top";
                    ctx.textAlign = "left";
                    ctx.font = `${16 * dpr}px ${CONFIG.fontFamily}`;
                    ctx.shadowColor = CONFIG.palette.base;

                    for (let i = 0; i < cols; i++) {
                        if (CONFIG.density < 1 && Math.random() > CONFIG.density) continue;
                        const x = i * colSize;
                        const spd = speeds[i] * scrollBoost;
                        let yPixel, curRow;
                        if (CONFIG.mode === "grid") {
                            const rowHeight = colSize * (CONFIG.grid?.line_height ?? 1.0);
                            const yRaw = yPositions[i] * colSize;
                            curRow = Math.round(yRaw / rowHeight);
                            const yAligned = curRow * rowHeight;
                            yPixel = CONFIG.grid?.snap ? yAligned : yRaw;
                            if (CONFIG.grid?.snap && curRow - lastRowDrawn[i] < (CONFIG.grid?.row_spacing ?? 1)) {
                                yPositions[i] += spd;
                                if (yPositions[i] * colSize > height + colSize) {
                                    yPositions[i] = 0;
                                    lastRowDrawn[i] = -1e9;
                                    speeds[i] = CONFIG.baseSpeed + Math.random() * CONFIG.speedVariance;
                                    activeWords[i] = null;
                                }
                                continue;
                            }
                        } else {
                            if (!Number.isFinite(yPositions[i])) yPositions[i] = 0;
                            yPixel = yPositions[i];
                        }

                        let ch, classes, meta;
                        let isWordChar = false,
                            wordState = null;
                        if (activeWords[i]) {
                            isWordChar = true;
                            wordState = activeWords[i];
                            const next = wordState.word[wordState.index] ?? " ";
                            ch = CONFIG.forceUppercase ? next.toUpperCase() : next;
                            classes = classifyChar(ch, null, true);
                        } else if (Math.random() < CONFIG.wordChance) {
                            const w = CONFIG.dropWords[(Math.random() * CONFIG.dropWords.length) | 0];
                            activeWords[i] = { word: w, index: 0 };
                            const first = w[0] ?? " ";
                            ch = CONFIG.forceUppercase ? first.toUpperCase() : first;
                            activeWords[i].index = 1;
                            isWordChar = true;
                            classes = classifyChar(ch, null, true);
                        } else {
                            meta = getCachedCharMeta();
                            ch = meta.ch;
                            classes = classifyChar(ch, meta.baseClass, false);
                        }

                        const hit = maskHit(x, yPixel);
                        const dx = x - mouse.x * dpr,
                            dy = yPixel - mouse.y * dpr;
                        const dist = Math.hypot(dx, dy);
                        const mouseFactor = Math.max(0, 1 - dist / (160 * dpr));
                        let envGlow = CONFIG.glowBase + hit * CONFIG.glowBoost + mouseFactor * 10;
                        let envColor = CONFIG.palette.base;
                        if (hit > 0.65) {
                            envColor = CONFIG.palette.bright;
                            if (Math.random() < 0.05) envColor = CONFIG.palette.flare;
                        } else if (mouseFactor > 0.25) {
                            envColor = CONFIG.palette.bright;
                        }
                        const style = applyClassStyles(envColor, envGlow, classes);

                        ctx.save();
                        ctx.translate(x, yPixel);
                        const scale = (colSize / (16 * dpr)) * CONFIG.glyphScale;
                        ctx.scale(scale, scale);
                        if (style.fontWeight || style.fontFamily) {
                            const BASE = 16 * dpr;
                            ctx.font = `${style.fontWeight || "normal"} ${BASE}px ${
                                style.fontFamily || CONFIG.fontFamily
                            }`;
                        }
                        ctx.fillStyle = style.color;
                        ctx.shadowColor = style.color;
                        ctx.shadowBlur = style.glow ?? 12;

                        ctx.shadowBlur = 0;
                        ctx.fillText(ch, 0, 0);
                        ctx.restore();

                        if (isWordChar && wordState) {
                            wordState.index++;
                            if (wordState.index >= wordState.word.length) activeWords[i] = null;
                        }

                        if (CONFIG.mode === "grid") {
                            lastRowDrawn[i] = Math.round(
                                (yPositions[i] * colSize) / (colSize * (CONFIG.grid?.line_height ?? 1.0))
                            );
                            yPositions[i] += spd;
                            if (yPositions[i] * colSize > height + colSize) {
                                yPositions[i] = 0;
                                lastRowDrawn[i] = -1e9;
                                speeds[i] = CONFIG.baseSpeed + Math.random() * CONFIG.speedVariance;
                                activeWords[i] = null;
                            }
                        } else {
                            yPositions[i] += spd * colSize;
                            if (yPositions[i] > height + colSize) {
                                yPositions[i] = -Math.random() * (height * 0.25);
                                speeds[i] = CONFIG.baseSpeed + Math.random() * CONFIG.speedVariance;
                                activeWords[i] = null;
                            }
                        }
                    }
                    requestAnimationFrame(draw);
                }

                function preventSpaceScroll(e) {
                    if (e.code === "Space") {
                        e.preventDefault();
                        log.info("Space prevented");
                    }
                }
                window.addEventListener("resize", resize);
                window.addEventListener(
                    "mousemove",
                    (e) => {
                        mouse.x = e.clientX;
                        mouse.y = e.clientY;
                    },
                    { passive: true }
                );
                window.addEventListener("mouseleave", () => {
                    mouse.x = -9999;
                    mouse.y = -9999;
                });
                window.addEventListener("keydown", preventSpaceScroll);

                const btnPause = document.getElementById("togglePause");
                const btnMode = document.getElementById("toggleMode");
                btnPause.addEventListener("click", () => {
                    paused = !paused;
                    btnPause.innerHTML = paused
                        ? "Play <span class='kbd'>Ctrl</span>"
                        : "Pause <span class='kbd'>Ctrl</span>";
                    btnPause.setAttribute("aria-pressed", String(paused));
                });
                btnMode.addEventListener("click", () => {
                    CONFIG.mode = CONFIG.mode === "grid" ? "free" : "grid";

                        1
                    )}</strong>&nbsp;Mode&nbsp;<span class="kbd">Alt</span>`;
                    resize();
                });
                window.addEventListener("keydown", (e) => {
                    if (e.key.toLowerCase() === "g") {
                        CONFIG.mode = CONFIG.mode === "grid" ? "free" : "grid";
                        btnMode.innerHTML = `<strong>${CONFIG.mode[0].toUpperCase()}${CONFIG.mode.slice(
                            1
                        )}</strong>&nbsp;Mode&nbsp;<span class="kbd">Alt</span>`;
                        resize();
                    }
                });

                /* Entry typing + gate */
                const typedEcho = document.getElementById("typedEcho");
                const srTyped = document.getElementById("srTyped");
                const modal = document.getElementById("modalStrip");
                const backdrop = document.getElementById("backdrop");
                const hero = document.getElementById("hero");
                let buffer = "";
                let gateOpen = false;

                function updateEcho() {
                    typedEcho.textContent = buffer;
                    // srTyped.textContent = buffer.length ? `Typed ${buffer}` : "";
                }
                function openGate() {
                    if (gateOpen) return;
                    gateOpen = true;
                    paused = true;
                    // document.body.classList.add("modal-open"); // lock body scroll
                    btnPause.innerHTML = 'Play&nbsp;<span class="kbd">Ctrl</span>';
                    btnPause.setAttribute("aria-pressed", "true");
                    hero.classList.add("split-open");
                    modal.classList.add("active");
                    backdrop.classList.add("active");
                }
                function closeGate() {
                    if (!gateOpen) return;
                    gateOpen = false;
                    // document.body.classList.remove("modal-open"); // lock body scroll
                    backdrop.classList.remove("active");
                    modal.classList.remove("active");
                    hero.classList.remove("split-open");
                    paused = false;
                    btnPause.innerHTML = 'Pause&nbsp;<span class="kbd">Ctrl</span>';
                    btnPause.setAttribute("aria-pressed", "false");
                }

                window.addEventListener("keydown", (e) => {
                    window.dispatchEvent(new KeyboardEvent("keydown", { key: "escape" }));
                    if (e.key === "Enter") {
                        const raw = buffer;
                        const value = normalizeKey(raw);
                        if (value && ENTRY_KEYWORDS.includes(value)) {
                            setModalContent(value);
                            openGate();
                            buffer = "";
                            updateEcho();
                        } else {
                            buffer = "";
                            updateEcho();
                        }
                        return;
                    }
                    if (e.key === "Backspace") {
                        e.preventDefault();
                        if (buffer.length) {
                            buffer = buffer.slice(0, -1);
                            updateEcho();
                        }
                        return;
                    }
                    if (e.ctrlKey) {
                        btnPause.click();
                    }
                    if (e.altKey) {
                        btnMode.click();
                    }
                    // if (e.ctrlKey || e.metaKey || e.altKey) return;
                    if (e.key.length === 1) {
                        buffer += e.key;
                        updateEcho();
                    }
                });
                window.addEventListener("keydown", (e) => {
                    if (e.key.toLowerCase() === "escape" && gateOpen) {
                        closeGate();
                    }
                });

                /* Setup */
                setupEmailCopy(document);

                /* Boot */
                resize();
                refillCharPool();
                nextCharPoolRefresh = performance.now() + CONFIG.charPoolRefreshMs;
                requestAnimationFrame(draw);
            })();

                    />
                    <button
                        id="neo-send"
                        type="submit"
                        style="
                            padding: 10px 14px;
                            border-radius: 8px;
                            border: 0;
                            background: #2d6cdf;
                            color: #fff;
                            cursor: pointer;
                        "
                    >
                        Send
                    </button>
                </form>
            </div>
        </div>

        <!-- neon1-site :: Neo chat script -->
        <script src="/neo-config.js"></script>
        <script>
            const $ = (sel) => document.querySelector(sel);
            const NEO_SESSION_KEY = "neo_session_id";
            const neoSessionId =
                localStorage.getItem(NEO_SESSION_KEY) || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
            localStorage.setItem(NEO_SESSION_KEY, neoSessionId);
            const neoModal = document.getElementById("neo-modal");
            const neoOpen = () => {
                neoModal.style.display = "block";
                setTimeout(() => $("#neo-input")?.focus(), 0);
            };
            const neoClose = () => {
                neoModal.style.display = "none";
            };
            document.addEventListener("click", (e) => {
                if (e.target.id === "neo-close" || e.target === neoModal) neoClose();
            });
            document.addEventListener("keydown", (e) => {
                if (e.ctrlKey && e.key === "/") {
                    neoOpen();
                    e.preventDefault();
                }
                if (e.key === "Escape" && neoModal.style.display === "block") neoClose();
            });
            document.addEventListener("click", (e) => {
                const t = e.target.closest("[data-open-neo]");
                if (t) {
                    neoOpen();
                    e.preventDefault();
                }
            });
            const feed = $("#neo-feed");
            function pushMessage(role, text) {
                const div = document.createElement("div");
                div.style.margin = "8px 0";
                div.style.whiteSpace = "pre-wrap";
                div.innerHTML =
                    role === "user"
                        ? '<strong style="color:#91c9ff">You:</strong> ' + escapeHtml(text)
                        : '<strong style="color:#8af">Neo:</strong> ' + escapeHtml(text);
                feed.appendChild(div);
                feed.scrollTop = feed.scrollHeight;
            }
            function escapeHtml(s) {
                return s.replace(
                    /[&<>"']/g,
                    (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])
                );
            }
            const form = $("#neo-form");
            form?.addEventListener("submit", async (e) => {
                e.preventDefault();
                const input = $("#neo-input");
                const message = (input?.value || "").trim();
                if (!message) return;
                pushMessage("user", message);
                input.value = "";
                const url = (window.NEO_CHAT_API || "").toString();
                if (!url) {
                    pushMessage("assistant", "Backend not configured. Ask someone to set NEO_CHAT_API.");
                    return;
                }
                try {
                    const res = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message, sessionId: neoSessionId }),
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || "Request failed");
                    pushMessage("assistant", data.reply || "(no reply)");
                } catch (err) {
                    pushMessage("assistant", "Error: " + (err?.message || String(err)));
                }
            });
        </script>
        <button
            data-open-neo
            style="
                position: fixed;
                right: 16px;
                bottom: 16px;
                z-index: 9998;
                padding: 10px 12px;
                border-radius: 999px;
                border: 0;
                background: #111;
                color: #fff;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
            "
        >
            Neo
        </button>
    </body>
</html>
