# .github/workflows/dev.yml - Put a branch on dev.neon1.tech, the private preview, in about a minute.
# The dev branch is the dev release at dev.neon1.tech/; any other branch (main aside) is a preview that
# dev.neon1.tech/__preview?b=<name> switches to. A manual run can show a neon1-corpus branch instead of
# the newest corpus release (corpus_ref: draft/<post>), drafts included, as its own preview. Only the
# quick checks run here; the browser contracts and PDF printing run on the way to main (deploy.yml).
# Dev deploys are never tagged, announced, or verified against neon1.tech.
# dev-sync.yml calls this on every production deploy to rebuild the dev release (ref dev) from the new main.
# A dev release pinned to a neon1-corpus branch first takes in the corpus release production uses, so dev's
# words never fall behind production's.

name: dev

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      corpus_ref:
        description: A neon1-corpus branch to show (e.g. draft/my-post); empty takes the newest release
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: The branch to build
        type: string
        default: dev
      corpus_tag:
        description: The neon1-corpus release production uses; empty takes the newest
        type: string
        default: ""

# Read-only by default; the job adds an OIDC token for the dev deploy role
permissions:
  contents: read

# One run per branch (or corpus branch); a newer push replaces a queued or running one. A called run reads
# github.ref_name as the caller's branch (main), so it names its own branch, and lands in the same group as a push
# to dev: two builds of the dev release can't race, and the newest holds everything the older one did
concurrency:
  group: dev-${{ inputs.ref || github.ref_name }}-${{ inputs.corpus_ref }}
  cancel-in-progress: true

jobs:
  dev:
    runs-on: ubuntu-latest
    # Quiet until the dev deploy role exists (neon1-aws-infrastructure github/dev.tf)
    if: vars.AWS_DEV_DEPLOY_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
    steps:
      # A call names the branch to build; a push or manual run builds the one it ran on
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # On the dev branch, a .dev-corpus-ref file (dev only, never on main) names a neon1-corpus branch for the
      # dev release itself, so a site change and the corpus change it needs can be seen together at dev.neon1.tech/
      - name: Pick the corpus
        id: corpus
        env:
          BRANCH: ${{ inputs.ref || github.ref_name }}
          CORPUS_REF: ${{ inputs.corpus_ref }}
        run: |
          ref="$CORPUS_REF"
          pinned=
          if [ -z "$ref" ] && [ "$BRANCH" = dev ] && [ -s .dev-corpus-ref ]; then ref=$(tr -d '[:space:]' < .dev-corpus-ref); pinned=yes; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

      # A pinned corpus branch must hold the corpus release production uses, or dev would show older words than
      # production. If it doesn't, the release is merged into the pinned branch in a throwaway clone here (never
      # pushed) and the build reads that tree through CORPUS_DIR. A conflict stops the build
      - name: Keep the pinned corpus branch current
        if: steps.corpus.outputs.pinned == 'yes'
        env:
          PIN: ${{ steps.corpus.outputs.ref }}
          PROD_TAG: ${{ inputs.corpus_tag }}
        run: |
          repo=https://github.com/neon1llc/neon1-corpus
          tag="$PROD_TAG"
          if [ -z "$tag" ]; then
            tag=$(git ls-remote --tags --refs --sort=-v:refname "$repo" 'v*' \
              | sed -n 's|.*refs/tags/\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$|\1|p' | head -1)
          fi
          test -n "$tag" || { echo "::error::no neon1-corpus release found"; exit 1; }
          dir="$RUNNER_TEMP/corpus-merged"
          git clone -q --no-checkout "$repo" "$dir"
          git -C "$dir" rev-parse -q --verify "refs/remotes/origin/$PIN" >/dev/null \
            || { echo "::error::.dev-corpus-ref names $PIN, which is not a neon1-corpus branch"; exit 1; }
          if git -C "$dir" merge-base --is-ancestor "refs/tags/$tag" "refs/remotes/origin/$PIN"; then
            echo "$PIN already has neon1-corpus $tag"
            exit 0
          fi
          git -C "$dir" config user.name "github-actions[bot]"
          git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$dir" checkout -q -B pinned "refs/remotes/origin/$PIN"
          if ! git -C "$dir" merge --no-edit -m "Merge $tag into $PIN" "refs/tags/$tag" >/dev/null; then
            git -C "$dir" merge --abort
            echo "::error::neon1-corpus $PIN and $tag conflict; merge main or the release into $PIN by hand"
            echo "### neon1-corpus $PIN needs main (the $tag release) merged by hand" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "$PIN did not have $tag; built from $PIN with $tag merged in"
          echo "### neon1-corpus $PIN did not have $tag; dev is built from it with the release merged in (not pushed)" >> "$GITHUB_STEP_SUMMARY"
          echo "CORPUS_DIR=$dir" >> "$GITHUB_ENV"

      # The preview this run writes: the dev release, a branch, or a corpus branch
      - name: Pick the dev key
        id: key
        env:
          BRANCH: ${{ inputs.ref || github.ref_name }}
          CORPUS_REF: ${{ steps.corpus.outputs.ref }}
          ASKED: ${{ inputs.corpus_ref }}
        run: |
          if [ -n "$CORPUS_REF" ] && [ "$BRANCH" != dev -o -n "$ASKED" ]; then name=$(python3 scripts/dev_build.py name "corpus-$CORPUS_REF"); key="branch:$name"
          elif [ "$BRANCH" = dev ]; then name=dev; key=release
          else name=$(python3 scripts/dev_build.py name "$BRANCH"); key="branch:$name"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Same build as make dev-build: a copy of the site, the corpus words, and the live site's PDFs. Without a
      # corpus branch it takes the release production uses, when a call names one, and otherwise the newest
      - name: make dev-build
        env:
          CORPUS_REF: ${{ steps.corpus.outputs.ref }}
          PROD_TAG: ${{ inputs.corpus_tag }}
        run: |
          want="${CORPUS_REF:-$PROD_TAG}"
          if [ -n "$want" ]; then make dev-build CORPUS_TAG="$want"; else make dev-build; fi

      - run: make dev-check

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload and switch
        run: python3 scripts/deploy.py dev .dev-build/site neon1-site-dev neon1-site-dev "${{ steps.key.outputs.key }}"

      - name: Where to look
        env:
          NAME: ${{ steps.key.outputs.name }}
        run: |
          if [ "$NAME" = dev ]; then url=https://dev.neon1.tech/; else url="https://dev.neon1.tech/__preview?b=$NAME"; fi
          echo "### On dev: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "$url"
